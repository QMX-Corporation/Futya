# .github/workflows/memory_leaks.yml
# SPDX-License-Identifier: GPL-2.0-only

name: Futya OS Lethal Memory Safety & Leak Validation

on: [push, pull_request]

jobs:
  kernel-stress-matrix:
    name: Core Stress Matrix (1000+ Vectors)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Deploy Bare-Metal & Analysis Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            gcc-aarch64-none-elf \
            binutils-aarch64-none-elf \
            gcc \
            g++ \
            qemu-system-aarch64 \
            valgrind \
            gdb-multiarch \
            python3-minimal

      - name: Build Production Kernel (AArch64 Bare-Metal)
        run: |
          make TARGET=aarch64 clean
          make TARGET=aarch64 -j$(nproc)

      - name: Build Core Algorithms for Host Execution (Valgrind Validation Target)
        run: |
          make TARGET=host-test clean
          make TARGET=host-test -j$(nproc)

      - name: Execute Mass Parallel Stress Engine (Valgrind + QEMU/GDB)
        run: |
          mkdir -p test_reports/valgrind test_reports/qemu_gdb
          
          echo "======================================================================"
          echo "LAUNCHING FUTYA OS MASSIVE MEMORY STRESS MATRIX (1000+ INJECTION VECTORS)"
          echo "======================================================================"
          
          # Vetores 1-500: Validação Algorítmica Rígida de Alocação e Vazamento (Valgrind)
          echo "[PHASE 1] Executing Vectors 1-500 via Host-Isolation Valgrind Engine..."
          for i in {1..500}; do
            valgrind --leak-check=full \
                     --show-leak-kinds=all \
                     --errors-exitcode=255 \
                     --undef-value-errors=yes \
                     --track-origins=yes \
                     --log-file=test_reports/valgrind/vector_${i}.log \
                     ./build/host-test --vector=$i --seed=$((i * 1337)) || {
                       echo "❌ FATAL: Memory leak or safety violation detected in Host Vector #$i"
                       cat test_reports/valgrind/vector_${i}.log
                       exit 1
                     }
          done

          echo "[PHASE 2] Executing Vectors 501-1000 via Bare-Metal AArch64 Simulation..."
          for i in {501..1000}; do
            cat << EOF > gdb_script.py
          target remote :1234
          set pagination off
          break page_fault_handler
          break kernel_panic
          commands
            backtrace
            quit 255
          end
          continue
          quit 0
          EOF

            qemu-system-aarch64 -M virt -cpu cortex-a53 -nographic -kernel ./build/futya_kernel.elf -s -S > test_reports/qemu_gdb/qemu_vector_${i}.log 2>&1 &
            QEMU_PID=$!

            gdb-multiarch ./build/futya_kernel.elf -x gdb_script.py > test_reports/qemu_gdb/gdb_vector_${i}.log 2>&1
            GDB_STATUS=$?

            kill -9 $QEMU_PID 2>/dev/null
            wait $QEMU_PID 2>/dev/null

            if [ $GDB_STATUS -ne 0 ]; then
              echo "❌ FATAL: Kernel Panic or Page Fault detected in Bare-Metal Vector #$i"
              cat test_reports/qemu_gdb/gdb_vector_${i}.log
              exit 1
            fi
          done

          echo "======================================================================"
          echo "SUCCESS: 1000+ MEMORY TEST VECTORS PASSED. ZERO LEAKS. ZERO PANICS."
          echo "======================================================================"

      - name: Archive Diagnostics and Memory Logs
        if: always()
        uses: actions/artifacts/upload@v4
        with:
          name: futya-memory-stress-logs
          path: test_reports/
